# Memory caps for an 8 GB machine (D-017)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle daemon instead of a separate Kotlin daemon (saves ~0.5-1 GB).
kotlin.compiler.execution.strategy=in-process
# Stop idle Gradle daemons after 10 minutes so their memory is released.
org.gradle.daemon.idletimeout=600000
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# Screenshot tests compare against committed references in src/test/screenshots (Testing Policy #3).
# Re-record after an approved UI change: ./gradlew recordRoborazziDebug
roborazzi.test.verify=true
