# Publishes the website (site/, D-058) to GitHub Pages when it or what it shows changes on main.
# Needs Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.py"
      - "scripts/test_build_site.py"
      - "docs/brand/zeroos-logo.svg"
      - "core/ui/src/main/res/font/**"
      - "**/src/test/screenshots/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for hardcoded text
        run: python3 -B scripts/test_build_site.py
      - name: Build
        run: python3 scripts/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
